---
# CI fixture: a pre-provisioned MySQL server with no OJS bootstrap/root access.
services:
  ojs:
    environment:
      INGRESS_SCHEME: http
      DB_HOST: external-mysql
      DB_PORT: "3307"
      DB_NAME: journal_test
      DB_USER: journal_app
  external-mysql:
    image: mysql:8.4
    command: ["--port=3307"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: journal_test
      MYSQL_USER: journal_app
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PASSWORD
    secrets:
      - source: OJS_DB_PASSWORD
        target: DB_PASSWORD
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--port=3307", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
