name: lint-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [local, external-mysql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: make lint
      - if: matrix.database == 'local'
        run: cp compose.override-example.yaml compose.override.yaml
      - if: matrix.database == 'external-mysql'
        run: cp tests/compose.external-mysql.yaml compose.override.yaml
      - run: make deps
      - run: make test
      - run: ./scripts/test-admin-login.sh
      - name: Verify existing database after container recreation
        run: |
          docker compose up -d --force-recreate --wait --wait-timeout 1200 ojs
          ./scripts/test.sh
          ./scripts/test-admin-login.sh
      - if: failure()
        run: docker compose logs
