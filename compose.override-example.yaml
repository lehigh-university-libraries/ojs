---
volumes:
  mariadb-data: {}

services:
  traefik:
    environment:
      # Public test keys, never use this override in production.
      # https://developers.cloudflare.com/turnstile/troubleshooting/testing/
      TURNSTILE_PUBLIC_KEY: 1x00000000000000000000AA
      TURNSTILE_PRIVATE_KEY: 1x0000000000000000000000000000000AA
  ojs:
    environment:
      INGRESS_SCHEME: http
      OJS_SMTP_SERVER: mailpit
      OJS_SMTP_PORT: "1025"
    depends_on:
      database-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.31@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    ports:
      - "1025:1025"
      - "8025:8025"

  database-init:
    image: ghcr.io/lehigh-university-libraries/base:3.2.2.0@sha256:498e4486c9dcb3590799268b91902806203d49605702d1604750ec3b7b22adcc
    restart: "no"
    networks:
      default:
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ojs}
      DB_USER: ${DB_USER:-ojs}
      DB_CHARACTER_SET: utf8
      DB_COLLATION: utf8_general_ci
    secrets:
      - source: DB_ROOT_PASSWORD
      - source: OJS_DB_PASSWORD
        target: DB_PASSWORD
    entrypoint: /usr/local/bin/init-database.sh
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    restart: unless-stopped
    image: ghcr.io/lehigh-university-libraries/mariadb:11@sha256:952f1dc279c9d795bab65419f346f10d4022748e6ed0ee96c39c3b1766d64c13
    volumes:
      - mariadb-data:/var/lib/mysql:rw
    secrets:
      - source: DB_ROOT_PASSWORD
