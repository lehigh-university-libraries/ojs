---
# Local projects must not reserve the production subnet/gateway.
networks:
  default:
    ipam: !reset null

volumes:
  mariadb-data: {}

services:
  db-backup:
    profiles: [none]
  traefik:
    environment:
      # Public test keys, never use this override in production.
      # https://developers.cloudflare.com/turnstile/troubleshooting/testing/
      TURNSTILE_PUBLIC_KEY: 1x00000000000000000000AA
      TURNSTILE_PRIVATE_KEY: 1x0000000000000000000000000000000AA
  ojs:
    environment:
      INGRESS_SCHEME: http
      OJS_SMTP_SERVER: mailpit
      OJS_SMTP_PORT: "1025"
    depends_on:
      database-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.34@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports:
      - "1025:1025"
      - "8025:8025"

  database-init:
    image: ghcr.io/lehigh-university-libraries/base:3.2.2.0@sha256:ed9cf4f9b330aad97ab926fca42c014b1aa449e2c1c1bf6228a6f2016de047fd
    restart: "no"
    networks:
      default:
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ojs}
      DB_USER: ${DB_USER:-ojs}
      DB_CHARACTER_SET: utf8
      DB_COLLATION: utf8_general_ci
    secrets:
      - source: DB_ROOT_PASSWORD
      - source: OJS_DB_PASSWORD
        target: DB_PASSWORD
    entrypoint: /usr/local/bin/init-database.sh
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    restart: unless-stopped
    image: ghcr.io/lehigh-university-libraries/mariadb:11@sha256:9509a907b9fd10738f9cb163f6437336638139727b2be82b4d91a2449766430c
    volumes:
      - mariadb-data:/var/lib/mysql:rw
    secrets:
      - source: DB_ROOT_PASSWORD
