---
volumes:
  mariadb-data: {}

services:
  traefik:
    environment:
      # Public test keys, never use this override in production.
      # https://developers.cloudflare.com/turnstile/troubleshooting/testing/
      TURNSTILE_PUBLIC_KEY: 1x00000000000000000000AA
      TURNSTILE_PRIVATE_KEY: 1x0000000000000000000000000000000AA
  ojs:
    environment:
      INGRESS_SCHEME: http
      OJS_SMTP_SERVER: mailpit
      OJS_SMTP_PORT: "1025"
    depends_on:
      database-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.32@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - "1025:1025"
      - "8025:8025"

  database-init:
    image: ghcr.io/lehigh-university-libraries/base:3.2.2.0@sha256:4afc19221716fd02b869f35de34ae03bef9bb2e717ec1fead7fc1db19c3feb4c
    restart: "no"
    networks:
      default:
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ojs}
      DB_USER: ${DB_USER:-ojs}
      DB_CHARACTER_SET: utf8
      DB_COLLATION: utf8_general_ci
    secrets:
      - source: DB_ROOT_PASSWORD
      - source: OJS_DB_PASSWORD
        target: DB_PASSWORD
    entrypoint: /usr/local/bin/init-database.sh
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    restart: unless-stopped
    image: ghcr.io/lehigh-university-libraries/mariadb:11@sha256:dc981d43e0c9eb39b0f31195c04d571aa07788826919aa69d2376e895a4d5a62
    volumes:
      - mariadb-data:/var/lib/mysql:rw
    secrets:
      - source: DB_ROOT_PASSWORD
