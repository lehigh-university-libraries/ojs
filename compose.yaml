---
x-common: &common
  restart: unless-stopped
  networks:
    default:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
          gateway: 172.23.0.1

volumes:
  ojs-cache: {}
  ojs-files: {}
  ojs-public: {}

secrets:
  DB_ROOT_PASSWORD:
    file: ./secrets/DB_ROOT_PASSWORD
  OJS_DB_PASSWORD:
    file: ./secrets/OJS_DB_PASSWORD
  OJS_API_KEY_SECRET:
    file: ./secrets/OJS_API_KEY_SECRET
  OJS_SALT:
    file: ./secrets/OJS_SALT
  OJS_ADMIN_PASSWORD:
    file: ./secrets/OJS_ADMIN_PASSWORD
  OJS_SECRET_KEY:
    file: ./secrets/OJS_SECRET_KEY

services:
  init:
    image: ghcr.io/lehigh-university-libraries/base:3.2.2.0@sha256:498e4486c9dcb3590799268b91902806203d49605702d1604750ec3b7b22adcc
    restart: "no"
    working_dir: /work
    environment:
      COMPOSE_FILE: /work/compose.yaml
      SECRETS_ROOT: /work/secrets
      SECRET_FORMAT_OJS_SECRET_KEY: laravel-base64
    volumes:
      - ./secrets:/work/secrets:rw
      - ./compose.yaml:/work/compose.yaml:ro
      - ./scripts/validate-ojs-secret-key.sh:/usr/local/bin/validate-ojs-secret-key.sh:ro
    entrypoint:
      - /bin/bash
      - -euc
      - |
        umask 077
        mkdir -p "$$SECRETS_ROOT"
        # OJS login forms accept at most 32 characters.
        if [ ! -s "$$SECRETS_ROOT/OJS_ADMIN_PASSWORD" ]; then
          openssl rand -hex 16 > "$$SECRETS_ROOT/OJS_ADMIN_PASSWORD"
        fi
        exec generate-compose-secrets.sh
    profiles: [none]

  traefik:
    <<: *common
    image: traefik:v3.7.14@sha256:575fa15b135078fe5e50aa847987d96dbddd7b093c172429618404df73f3fa7c
    command:
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.forwardedHeaders.trustedIPs=172.0.0.0/8
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=3600s
      - --providers.file.filename=/etc/traefik/config.yaml
      - --providers.file.watch=true
      - --experimental.localPlugins.captcha-protect.moduleName=github.com/libops/captcha-protect
    environment:
      TURNSTILE_PUBLIC_KEY: ${TURNSTILE_PUBLIC_KEY:-}
      TURNSTILE_PRIVATE_KEY: ${TURNSTILE_PRIVATE_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - 8888:80
    volumes:
      - ./conf/traefik/plugins/captcha-protect:/plugins-local/src/github.com/libops/captcha-protect:ro
      - ./conf/traefik/config.tmpl:/etc/traefik/config.yaml:ro
      - ./conf/traefik/challenge.tmpl.html:/challenge.tmpl.html:ro
      - ./tmp/traefik:/tmp:rw
    depends_on:
      ojs:
        condition: service_healthy
    healthcheck:
      test: traefik healthcheck --ping
      start_period: 10s

  ojs:
    <<: *common
    image: ghcr.io/lehigh-university-libraries/ojs:php83@sha256:409c8a37aabcd3e0f3246c8b14d31a9866b952c2acdfe7a76cf08b7f77b22648
    environment:
      OJS_OAI_REPOSITORY_ID: ${DOMAIN:-localhost}
      OJS_ENABLE_BEACON: 1
      OJS_SMTP_SERVER: ${OJS_SMTP_SERVER:-}
      OJS_SMTP_PORT: "${OJS_SMTP_PORT:-25}"
      OJS_DEFAULT_ENVELOPE_SENDER: ${OJS_DEFAULT_ENVELOPE_SENDER:-noreply@journals.lehigh.edu}
      INGRESS_HOSTNAMES: ${DOMAIN:-localhost}
      INGRESS_SCHEME: https
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: ${DB_NAME:-ojs}
      DB_USER: ${DB_USER:-ojs}
    secrets:
      - source: OJS_API_KEY_SECRET
      - source: OJS_SECRET_KEY
      - source: OJS_DB_PASSWORD
        target: DB_PASSWORD
      - source: OJS_SALT
      - source: OJS_ADMIN_PASSWORD
    volumes:
      - ojs-cache:/var/www/ojs/cache:rw
      - ojs-files:/var/www/files:rw
      - ojs-public:/var/www/ojs/public:rw
      - ./scripts/ojs-setup.sh:/usr/local/bin/ojs-setup.sh:ro
      - ./scripts/ojs-setup-up:/etc/s6-overlay/s6-rc.d/ojs-setup/up:ro
      - ./plugins/importexport/quickSubmit:/var/www/ojs/plugins/importexport/quickSubmit:ro
      - ./plugins/themes/healthSciences:/var/www/ojs/plugins/themes/healthSciences:ro
      - ./plugins/themes/lehigh:/var/www/ojs/plugins/themes/lehigh:ro
      - ./plugins/themes/lrsj:/var/www/ojs/plugins/themes/lrsj:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /installed && grep -q '^installed = On' /var/www/ojs/config.inc.php && wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10m
